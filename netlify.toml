[build]
  # Netlify Database migrations in netlify/database/migrations are applied by
  # the platform during deploy, so the build only builds.
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# After deploying, verify with:  curl https://<site>/api/health
# Next.js is detected automatically and gets Netlify's OpenNext adapter.
